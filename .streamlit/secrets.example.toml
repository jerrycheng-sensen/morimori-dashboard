# 範例不含有效憑證。複製到 Streamlit 的 Settings → Secrets，不要上傳 secrets.toml。
APP_PASSWORD = "CHANGE_TO_A_LONG_RANDOM_PASSWORD"
STATE_REPO = "YOUR_GITHUB_USERNAME/morimori-monitor-state"
STATE_BRANCH = "main"
STATE_TOKEN = "SET_PRIVATE_STATE_CONTENTS_READ_WRITE_TOKEN"

# 沿用既有 meta_access_token 也可，但排程 Secrets 必須使用大寫名稱。
META_ACCESS_TOKEN = ""
# 請以 Meta 應用程式後台確認仍支援的版本；不沿用原本的 v19.0。
META_API_VERSION = ""

GOOGLE_CLIENT_ID = ""
GOOGLE_CLIENT_SECRET = ""
GOOGLE_REFRESH_TOKEN = ""
GOOGLE_API_VERSION = "v26"
# 透過 MCC 存取時填 MCC ID（不含連字號）；直接存取可留空。
GOOGLE_LOGIN_CUSTOMER_ID = ""
# 新制 Cloud 專案存取不要求 developer token；既有值可選填。
GOOGLE_DEVELOPER_TOKEN = ""

LINE_CHANNEL_ACCESS_TOKEN = ""
LINE_RECIPIENT_ID = ""
# 選填多對象。規則可填 marketing 等代號。
LINE_RECIPIENTS_JSON = '{}'

# 選填：讓網頁按鈕啟動 Actions。此 Token 和私人資料寫入 Token 分開。
SOURCE_REPO = "YOUR_GITHUB_USERNAME/morimori-dashboard"
SOURCE_BRANCH = "main"
SOURCE_TOKEN = ""

# 只有本機示範用；正式設定請維持 false。
DEMO_MODE = false
