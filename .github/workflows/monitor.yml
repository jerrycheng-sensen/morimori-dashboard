name: 廣告異常巡檢

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: preview 不發送；send 正式通知（另需開啟 Secrets）
        type: choice
        options: [preview, send]
        default: preview

permissions:
  contents: read

concurrency:
  group: mori-ad-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STATE_REPO: ${{ secrets.STATE_REPO }}
      STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
      STATE_BRANCH: ${{ secrets.STATE_BRANCH }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_API_VERSION: ${{ secrets.META_API_VERSION }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_LOGIN_CUSTOMER_ID }}
      GOOGLE_API_VERSION: ${{ secrets.GOOGLE_API_VERSION }}
      GOOGLE_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_DEVELOPER_TOKEN }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_RECIPIENT_ID: ${{ secrets.LINE_RECIPIENT_ID }}
      LINE_RECIPIENTS_JSON: ${{ secrets.LINE_RECIPIENTS_JSON }}
      LIVE_NOTIFICATIONS_ENABLED: ${{ secrets.LIVE_NOTIFICATIONS_ENABLED }}
      REQUEST_MODE: ${{ inputs.mode }}
      TRIGGER: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝巡檢所需套件
        run: python -m pip install -r requirements-runner.txt
      - name: 執行（公開 log 不輸出廣告資料）
        shell: bash
        run: |
          export STATE_BRANCH="${STATE_BRANCH:-main}"
          args=()
          if [ "$TRIGGER" = "workflow_dispatch" ]; then
            args+=(--force)
          fi
          if [ "$TRIGGER" = "schedule" ] || [ "$REQUEST_MODE" = "send" ]; then
            args+=(--send)
          fi
          python -m mori.runner "${args[@]}"
