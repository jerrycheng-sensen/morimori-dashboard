name: 檔期廣告模型更新
on:
  push:
    branches: [main]
    paths: ['.github/workflows/festival-model.yml']
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mori-festival-model
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CREDENTIALS_KEY: ${{ secrets.CREDENTIALS_KEY }}
      STATE_REPO: ${{ secrets.STATE_REPO }}
      STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
      STATE_BRANCH: ${{ secrets.STATE_BRANCH }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_API_VERSION: ${{ secrets.META_API_VERSION }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_LOGIN_CUSTOMER_ID }}
      GOOGLE_API_VERSION: ${{ secrets.GOOGLE_API_VERSION }}
      GOOGLE_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_DEVELOPER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/integrate-ads-alerts-google
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-runner.txt
      - name: 更新私人模型（公開 log 僅顯示執行狀態）
        run: python -m mori.festival_model
